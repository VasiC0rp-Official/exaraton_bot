<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная схема метро</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
        }

        #map {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }


        .dimmed {
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        .active {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        circle {
            cursor: pointer;
            transition: fill 0.2s;
        }

            circle:hover {
                fill: limegreen;
            }
    </style>
</head>
<div id="load-status" style="position:fixed;bottom:10px;right:10px;background:#333;color:#0f0;padding:10px;font-family:monospace;font-size:12px;z-index:9999;border-radius:5px;">
    Загрузка проверяется...
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const status = document.getElementById('load-status');
        const svgs = document.querySelectorAll('svg');

        status.textContent = Найдено SVG: ${ svgs.length };

        if (svgs.length === 0) {
            status.textContent += ' | Нет SVG для проверки';
            status.style.background = '#666';
            return;
        }

        let loaded = 0;
        let errors = [];

        svgs.forEach((svg, i) => {
            // Проверяем, виден ли SVG (не collapsed/zero-size)
            const rect = svg.getBoundingClientRect();
            const isVisible = rect.width > 1 && rect.height > 1 &&
                window.getComputedStyle(svg).display !== 'none';

            if (isVisible) {
                loaded++;
                console.log(✅ SVG #${ i+ 1}: виден(${ rect.width.toFixed(0) }x${ rect.height.toFixed(0) }));
    } else {
        errors.push(SVG #${ i+ 1}: не виден(размер ${ rect.width.toFixed(0) }x${ rect.height.toFixed(0) }));
    console.error(❌ ${ errors[errors.length - 1]});
    status.textContent +=
❌ SVG #${ i + 1 } сломан;
    }

    // Проверяем ошибки внутри SVG (defs, use, etc.)
    const svgErrors = svg.querySelectorAll('use[missing]');
    if (svgErrors.length > 0) {
        errors.push(SVG #${ i+ 1}: ${ svgErrors.length } missing элементов);
    console.error(❌ SVG #${ i+ 1}: отсутствуют defs);
    }
  });

    // Финальный статус
    setTimeout(() => {
        if (errors.length === 0) {
            status.innerHTML = ✅ <strong>Все ${loaded}/${svgs.length} SVG загружены!</strong>;
            status.style.background = '#0a0';
        } else {
            status.innerHTML = ❌ ${ loaded } /${svgs.length} SVG OK<br>Ошибок: ${errors.length};
            status.style.background = '#a00';
            console.table(errors);
        }
    }, 100);

    console.log('=== SVG LOAD TEST ===');
    console.log(${ loaded } / ${ svgs.length } SVG видимы);
});
</script>

    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script>
        const svgEl = document.getElementById('svg1');

        // Ищем все группы в layer3, которые начинаются с "btn"
        const btnGroups = Array.from(svgEl.querySelectorAll('#layer3 g')).filter(g => {
            const label = g.getAttribute('inkscape:label') || '';
            return label.toLowerCase().startsWith('btn');
        });

        // Навешиваем слушатели
        btnGroups.forEach(btn => {
            btn.style.cursor = 'pointer';
            btn.addEventListener('click', (e) => {
                e.stopPropagation();

                // Убираем старую подсветку
                svgEl.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
                svgEl.classList.add('dimmed');

                // Эта кнопка остаётся яркой
                btn.classList.add('active');
                btn.classList.remove('dimmed');
                // Чтобы кнопка не попала под общий opacity SVG
                btn.style.opacity = '1';
                btn.style.mixBlendMode = 'normal';
            });
        });

        // Сброс при клике по пустому месту SVG
        svgEl.addEventListener('click', (e) => {
            if (!e.target.closest('#layer3 g')) {
                svgEl.classList.remove('dimmed');
                btnGroups.forEach(b => {
                    b.classList.remove('active');
                    b.style.opacity = '';
                });
            }
        });

        const panZoom = svgPanZoom('#svg1',
            {
                zoomEnabled: true,
                controlIconsEnabled: false,
                fit: true,
                center: true,
                minZoom: 0.3,
                maxZoom: 3,
                panEnabled: true,
                contain: true,
                zoomScaleSensitivity: 0.3,
                customEventsHandler: {
                    haltEventListeners: [
                        'touchstart', 'touchend',
                        'touchmove', 'touchleave', 'touchcancel'],
                    init: function (options) {
                        let touches = [];
                        let lastDist = null;
                        options.svgElement.addEventListener('touchstart', e => {
                            touches = e.touches;
                        });

                        options.svgElement.addEventListener('touchmove', e => {
                            if (e.touches.length === 2) {
                                e.preventDefault();

                                const dx = e.touches[0].pageX - e.touches[1].pageX;
                                const dy = e.touches[0].pageY - e.touches[1].pageY;
                                const dist = Math.hypot(dx, dy);

                                if (lastDist) {
                                    const scale = dist / lastDist;
                                    const zoom = options.instance.getZoom() * scale;

                                    // центр pinch-жеста
                                    const cx = (e.touches[0].pageX + e.touches[1].pageX) / 2;
                                    const cy = (e.touches[0].pageY + e.touches[1].pageY) / 2;

                                    options.instance.zoomAtPoint(zoom, { x: cx, y: cy });
                                }
                                lastDist = dist;
                            } else if (e.touches.length === 1 && touches.length === 1) {
                                // перемещение одним пальцем
                                const dx = e.touches[0].pageX - touches[0].pageX;
                                const dy = e.touches[0].pageY - touches[0].pageY;
                                options.instance.panBy({ x: dx, y: dy });
                                touches = e.touches;
                            }
                        });

                        options.svgElement.addEventListener('touchend', e => {
                            lastDist = null;
                            touches = [];
                        });
                    }
                }
            });

        //panZoom.zoom(1);
        panZoom.center();
    </script>
